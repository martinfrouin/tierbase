services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tierbase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tierbase
    # Published on loopback only, so the image build (host network) can prerender pages
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tierbase"]
      interval: 2s
      retries: 15

  app:
    build:
      context: .
      target: app
      network: host
      args:
        DATABASE_URL: postgres://tierbase:${POSTGRES_PASSWORD}@127.0.0.1:5432/tierbase
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://tierbase:${POSTGRES_PASSWORD}@db:5432/tierbase
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://tierbase:${POSTGRES_PASSWORD}@db:5432/tierbase
    volumes:
      - ./data/cache:/app/data/cache
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:

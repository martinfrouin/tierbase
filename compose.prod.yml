# Runs on the VM next to Popotheque: Postgres (reached by the Vercel site over TLS) and the sync worker.
# Deployed by .github/workflows/deploy-vm.yml: docker compose -f compose.prod.yml up --build -d
name: tierbase

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["sh", "/etc/tierbase/postgres-ssl.sh"]
    environment:
      POSTGRES_USER: tierbase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tierbase
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./certs:/certs:ro
      - ./db/postgres-ssl.sh:/etc/tierbase/postgres-ssl.sh:ro
      - ./db/pg_hba.conf:/etc/tierbase/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tierbase"]
      interval: 2s
      retries: 15

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgres://tierbase:${POSTGRES_PASSWORD}@db:5432/tierbase
    volumes:
      - ./data/cache:/app/data/cache
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
